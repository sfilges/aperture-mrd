[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aperture-snv"
version = "0.1.0"
description = "SNV candidate extraction, error suppression, and tumor fraction scoring for Aperture-MRD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pysam>=0.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
aperture-snv = "aperture_snv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aperture_snv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",   # line length handled by formatter
    "N802",   # allow uppercase function names (test_custom_C, etc.)
    "N803",   # allow uppercase argument names (C for regularization param — standard ML convention)
    "N806",   # allow uppercase variable names (X for feature matrices — standard ML convention)
    "RUF001", # allow ambiguous unicode in strings (Greek letters μ, σ in log messages)
    "RUF002", # allow ambiguous unicode in docstrings (Greek letters, en dashes)
    "RUF003", # allow ambiguous unicode in comments (en dashes in ranges like 0–1)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests

[tool.ruff.lint.isort]
known-first-party = ["aperture_snv"]
